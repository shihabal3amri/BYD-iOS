name: Validate AltStore source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check catalogue and release metadata
        run: python3 scripts/validate_source.py
      - name: Check localized pages
        run: python3 scripts/build_site.py --check
